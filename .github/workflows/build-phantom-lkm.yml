# =============================================================================
# build-phantom-lkm.yml
# =============================================================================
# Build Aurora VFS Kernel Module (.ko) using DDK (Device Driver Kit)
# Target: Android GKI 6.1 ARM64 (OnePlus ACE5 SM8650)
#
# Uses prebuilt DDK Docker image (same approach as KernelSU)
# The DDK image contains: kernel headers + Module.symvers + toolchain
# =============================================================================

name: Build aurora_vfs (SM8650)

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      kmi:
        description: 'GKI KMI version'
        required: false
        default: 'android14-6.1'
        type: choice
        options:
          - 'android14-6.1'
          - 'android15-6.6'
          - 'android14-5.15'
          - 'android15-5.15'
      ddk_release:
        description: 'DDK release date'
        required: false
        default: '20260313'
        type: string
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  KMI: ${{ inputs.kmi || 'android14-6.1' }}
  DDK_RELEASE: ${{ inputs.ddk_release || '20260313' }}
  MODULE_NAME: aurora_vfs
  OUTPUT_DIR: build-output

jobs:
  build-module:
    name: Build aurora_vfs.ko (android14-6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
      options: --privileged

    outputs:
      build_success: ${{ steps.build.outputs.build_success }}
      module_path: ${{ steps.build.outputs.module_path }}
      kmi: ${{ env.KMI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          echo "=== Verifying source files ==="
          ls -la *.c *.h Makefile 2>/dev/null || true

      - name: Diagnose DDK environment
        run: |
          echo "=========================================="
          echo "  DDK Environment Diagnostics"
          echo "=========================================="
          echo "--- uname ---"
          uname -a
          echo "--- env (kernel related) ---"
          env | grep -iE 'kernel|kdir|cc|clang|cross|arch' || true
          echo "--- /lib/modules/ ---"
          ls -la /lib/modules/ 2>/dev/null || true
          echo "--- /usr/src/ ---"
          ls -la /usr/src/ 2>/dev/null || true
          echo "--- which clang ---"
          which clang 2>/dev/null || true
          clang --version 2>/dev/null || true
          echo "--- which make ---"
          which make
          make --version | head -2
          echo "--- DDK specific paths ---"
          ls -la /ddk 2>/dev/null || true
          ls -la /kernel 2>/dev/null || true
          ls -la /workspace 2>/dev/null || true
          echo "--- Check for Module.symvers ---"
          find / -name "Module.symvers" 2>/dev/null | head -5 || true
          echo "=========================================="

      - name: Build aurora_vfs.ko
        id: build
        run: |
          set -exuo pipefail

          echo "=== Building aurora_vfs.ko for KMI: ${{ env.KMI }} ==="

          # DDK 环境中 CC=clang, 使用内核构建系统
          # KERNELDIR 环境变量由 DDK 容器设置
          cd $GITHUB_WORKSPACE

          # 如果容器有 KERNELDIR 环境变量，显式传递
          if [ -n "${KERNELDIR:-}" ]; then
            echo "Using KERNELDIR=$KERNELDIR"
            make CC=clang ARCH=arm64 KDIR="$KERNELDIR" 2>&1 | tee build.log
          else
            echo "KERNELDIR not set, using Makefile default"
            make CC=clang ARCH=arm64 2>&1 | tee build.log
          fi

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          if [ $BUILD_EXIT_CODE -eq 0 ] && [ -f "aurora_vfs.ko" ]; then
            echo "build_success=true" >> "${GITHUB_OUTPUT}"
            echo "module_path=$GITHUB_WORKSPACE/aurora_vfs.ko" >> "${GITHUB_OUTPUT}"

            mkdir -p $GITHUB_WORKSPACE/${{ env.OUTPUT_DIR }}
            cp aurora_vfs.ko $GITHUB_WORKSPACE/${{ env.OUTPUT_DIR }}/

            echo "=== Build successful ==="
            ls -lh aurora_vfs.ko
            modinfo aurora_vfs.ko || true
          else
            echo "build_success=false" >> "${GITHUB_OUTPUT}"
            echo "ERROR: Build failed with exit code $BUILD_EXIT_CODE"
            exit 1
          fi

      - name: Verify module format (ARM64)
        if: success()
        run: |
          file aurora_vfs.ko
          file aurora_vfs.ko | grep -q "ARM aarch64" || { echo "ERROR: Not ARM64!"; exit 1; }
          echo "Module format verified: ARM64 relocatable"

      - name: Output error log on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "  BUILD FAILED - Diagnostic Information"
          echo "=========================================="
          [ -f build.log ] && tail -150 build.log

      - name: Upload aurora_vfs.ko artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurora_vfs-${{ env.KMI }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/aurora_vfs.ko
            ${{ github.workspace }}/build.log
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() && 
      needs.build-module.outputs.build_success == 'true' && 
      (startsWith(github.ref, 'refs/tags/v') || 
       (github.event_name == 'workflow_dispatch' && inputs.create_release == true))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aurora_vfs-${{ needs.build-module.outputs.kmi }}-${{ github.run_id }}
          path: ./release-artifacts

      - name: Prepare release assets
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          cd ./release-artifacts
          [ -f "aurora_vfs.ko" ] && mv aurora_vfs.ko "aurora_vfs-${{ needs.build-module.outputs.kmi }}-${VERSION_TAG}.ko"
          sha256sum *.ko > SHA256SUMS.txt
          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Aurora VFS ${{ needs.build-module.outputs.kmi }} - ${{ env.VERSION_TAG }}"
          body: |
            ## Aurora VFS Kernel Module

            ### Build Information
            - **Target**: OnePlus ACE5 (SM8650)
            - **KMI**: `${{ needs.build-module.outputs.kmi }}`
            - **DDK Release**: `${{ env.DDK_RELEASE }}`
            - **Commit**: ${{ github.sha }}

            ### Installation
            ```bash
            adb push aurora_vfs-*.ko /data/local/tmp/
            adb shell su -c "insmod /data/local/tmp/aurora_vfs-*.ko"
            adb shell su -c "cat /sys/kernel/ztrosu/vfs/version"
            ```
          files: |
            ./release-artifacts/aurora_vfs-*.ko
            ./release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
